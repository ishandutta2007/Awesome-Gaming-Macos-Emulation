<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0a14"/><stop offset="50%" stop-color="#0d1124"/><stop offset="100%" stop-color="#150a21"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ff2d55"/><stop offset="50%" stop-color="#af52de"/><stop offset="100%" stop-color="#5856d6"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="lightGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow1{0%{transform:translate(0,0) scale(1);opacity:.35}50%{transform:translate(40px,-25px) scale(1.15);opacity:.55}}@keyframes floatSlow2{0%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(-35px,30px) scale(1.1);opacity:.5}}@keyframes pulseGrid{0%{opacity:.12}50%{opacity:.22}}@keyframes driftLine{0%{stroke-dashoffset:0}}.bg-rect{fill:url(#bgGrad)}.pill-text,.subtitle-text,.tagline-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:900;font-size:50px;fill:#fff}.subtitle-text{font-weight:500;font-size:21px;fill:#c0c6e0}.tagline-text{font-weight:400;font-size:15px;fill:#828ba8}.pill-text{font-weight:700;font-size:13px;fill:#fff}.animated-orb-1{animation:floatSlow1 10s ease-in-out infinite}.animated-orb-2{animation:floatSlow2 12s ease-in-out infinite}.grid-layer{animation:pulseGrid 6s ease-in-out infinite}.flow-line{stro