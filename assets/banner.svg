<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0d1124"/>
      <stop offset="100%" stop-color="#150a21"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="50%" stop-color="#af52de"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 50px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 21px;
        fill: #c0c6e0;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        fill: #828ba8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #ffffff;
      }

      /* Dynamic Animations */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.55; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        50% { transform: translate(-35px, 30px) scale(1.1); opacity: 0.5; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.22; }
      }
      @keyframes driftLine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      .animated-orb-1 {
        animation: floatSlow1 10s ease-in-out infinite;
      }
      .animated-orb-2 {
        animation: floatSlow2 12s ease-in-out infinite;
      }
      .grid-layer {
        animation: pulseGrid 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8, 12;
        animation: driftLine 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" class="bg-rect"/>

  <!-- Background Grid Pattern -->
  <g class="grid-layer" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Dynamic Glowing Ambient Orbs (Behind content in background) -->
  <g>
    <circle cx="220" cy="120" r="160" fill="#ff2d55" filter="url(#glow)" class="animated-orb-1" />
    <circle cx="980" cy="280" r="180" fill="#5856d6" filter="url(#glow)" class="animated-orb-2" />
    <circle cx="600" cy="350" r="120" fill="#00f2fe" filter="url(#glow)" class="animated-orb-1" />
  </g>

  <!-- Flow Accents in Background (Non-intrusive) -->
  <path d="M 120 330 Q 350 290 600 320 T 1080 310" fill="none" stroke="#af52de" stroke-width="2" opacity="0.4" class="flow-line" />
  <path d="M 100 80 Q 450 140 800 90 T 1120 120" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.3" class="flow-line" />

  <!-- Foreground Content Container -->
  <!-- Top Badge / Pill -->
  <g transform="translate(435, 45)">
    <rect width="330" height="34" rx="17" fill="#1b1e36" stroke="#af52de" stroke-width="1.5" opacity="0.95"/>
    <circle cx="22" cy="17" r="5" fill="#30d158" filter="url(#lightGlow)"/>
    <text x="36" y="22" class="pill-text" fill="#e0e0f8">APPLE SILICON GAMING &amp; EMULATION</text>
  </g>

  <!-- Main Title with Gradient fill -->
  <text x="600" y="145" text-anchor="middle" class="title-text" filter="url(#lightGlow)">
    Gaming &amp; macOS Emulation
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" class="subtitle-text">
    The Definitive Awesome Directory for Apple Silicon &amp; Mac Gaming
  </text>

  <!-- Tagline / Focus Areas -->
  <text x="600" y="235" text-anchor="middle" class="tagline-text">
    DirectX-to-Metal (D3DMetal / DXMT) • Wine &amp; GPTK • UTM Virtualization • Native Console Emulators • Cloud RTX
  </text>

  <!-- Bottom Interactive-styled Feature Cards / Badges (In foreground, cleanly placed) -->
  <g transform="translate(180, 280)">
    <!-- Pill 1: Wine & GPTK -->
    <g transform="translate(0, 0)">
      <rect width="180" height="50" rx="10" fill="#181c33" stroke="#ff2d55" stroke-width="1.5" opacity="0.95"/>
      <text x="90" y="31" text-anchor="middle" class="pill-text" fill="#ff7597">🍷 Wine &amp; GPTK</text>
    </g>

    <!-- Pill 2: Metal Translation -->
    <g transform="translate(220, 0)">
      <rect width="180" height="50" rx="10" fill="#181c33" stroke="#af52de" stroke-width="1.5" opacity="0.95"/>
      <text x="90" y="31" text-anchor="middle" class="pill-text" fill="#d39bff">⚡ Metal &amp; DXMT</text>
    </g>

    <!-- Pill 3: Native Emulators -->
    <g transform="translate(440, 0)">
      <rect width="180" height="50" rx="10" fill="#181c33" stroke="#5856d6" stroke-width="1.5" opacity="0.95"/>
      <text x="90" y="31" text-anchor="middle" class="pill-text" fill="#9d9bf6">🎮 Console Emulators</text>
    </g>

    <!-- Pill 4: Virtualization -->
    <g transform="translate(660, 0)">
      <rect width="180" height="50" rx="10" fill="#181c33" stroke="#00f2fe" stroke-width="1.5" opacity="0.95"/>
      <text x="90" y="31" text-anchor="middle" class="pill-text" fill="#6be5ff">💻 Virtualization (UTM)</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect width="1196" height="396" x="2" y="2" rx="15" fill="none" stroke="#34395a" stroke-width="1.5" opacity="0.6"/>
</svg>